name: Java CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin
          cache: maven


      - name: Build and package
        run: mvn package -f bai03/pom.xml -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v3
        with:
          name: mathutils-jar
          path: bai03/target/*.jar
