name: Java CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -f bai03/pom.xml

      - name: Build and package
        run: mvn package -f bai03/pom.xml -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mathutils-jar
          path: bai03/target/*.jar